# 自动编译 ShadcnWidgetToolsExample
# 在 Windows / Linux / macOS 最新系统镜像上使用 Qt 6.12.0 构建示例程序，main 分支推送后发布到 GitHub Release

name: Build Example

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'ShadcnWidgetTools/**'
      - 'ShadcnWidgetToolsExample/**'
      - '.github/workflows/build-example.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QT_VERSION: 6.12.0

# 同一 ref 上的连续推送取消上一次未完成的运行
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # aqtinstall 3.3.0 无法读取 Qt 6.11 起 Windows 按架构拆分的仓库目录，修复（miurahr/aqtinstall#1000）尚未发布，固定到已合并该修复的提交
          - name: Windows / MSVC 2022
            os: windows-latest
            qt_arch: win64_msvc2022_64
            preset: msvc-release
            aqt_source: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
          - name: Linux / GCC
            os: ubuntu-latest
            qt_arch: linux_gcc_64
            preset: linux-gcc-release
            aqt_source: ''
          - name: macOS / Clang
            os: macos-latest
            qt_arch: clang_64
            preset: macos-release
            aqt_source: ''

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v7

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libgl1-mesa-dev libglu1-mesa-dev libegl1 libvulkan-dev libfontconfig1 libdbus-1-3 libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: 安装 Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # qtshadertools 用于图表 GPU 绘制，Qt Network（AI 对话页面）与 Linguist Tools（界面翻译）已包含在基础安装中
      - name: 安装 Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          target: desktop
          modules: qtshadertools
          aqtsource: ${{ matrix.aqt_source }}
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-${{ matrix.qt_arch }}

      - name: 配置 MSVC 开发环境
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: CMake configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }} -DQT_SDK_DIR="$QT_ROOT_DIR"

      - name: CMake build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      # install 时由 Qt 部署脚本复制运行库（windeployqt / macdeployqt / Linux 通用部署）
      - name: CMake install
        run: cmake --install build/${{ matrix.preset }}

      # 只打包运行所需文件，不含头文件、导入库、CMake 配置与 Qt 自带翻译（程序未加载）
      # Windows 的 Qt 插件已部署在 bin 中；Linux 的 qt.conf 以上级目录为前缀，plugins 需与 bin 同级；macOS 的运行库已由 macdeployqt 放入 .app
      # 先打包再上传：upload-artifact 不保留可执行权限与符号链接，macOS framework 依赖符号链接
      - name: 打包产物
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="ShadcnWidgetToolsExample-${{ runner.os }}-qt${QT_VERSION}"
          src="install/${{ matrix.preset }}"
          stage="package/${name}"
          mkdir -p "$stage" dist
          case "$RUNNER_OS" in
            Windows)
              cp -a "$src/bin" "$stage/"
              ;;
            Linux)
              mkdir -p "$stage/lib"
              cp -a "$src/bin" "$src/plugins" "$stage/"
              cp -a "$src"/lib/*.so.* "$stage/lib/"
              ;;
            macOS)
              cp -a "$src/ShadcnWidgetToolsExample.app" "$stage/"
              ;;
          esac
          if [ "$RUNNER_OS" = "Windows" ]; then
            file="dist/${name}.zip"
            (cd package && 7z a -tzip "../${file}" "${name}" > /dev/null)
          else
            file="dist/${name}.tar.gz"
            tar -C package -czf "${file}" "${name}"
          fi
          ls -lh dist/
          echo "file=${file}" >> "$GITHUB_OUTPUT"

      # archive: false 直接上传压缩包，不再套一层 zip，artifact 名称即文件名
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.file }}
          archive: false
          retention-days: 14
          if-no-files-found: error

  release:
    name: 发布到 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 仅 main 分支推送与手动触发会发布，PR 不发布
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      # skip-decompress 保持压缩包原样，否则 Windows 的 zip 会被自动解压
      - name: 下载所有平台产物
        uses: actions/download-artifact@v8
        with:
          pattern: ShadcnWidgetToolsExample-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: 用日期生成 tag 并清理同日旧 release
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh dist/
          # tag 格式 vYYYY.MM.DD（UTC）
          tag="v$(date -u +%Y.%m.%d)"
          # 同日已有 release 时连同 tag 一并删除，让 tag 指向本次构建的提交
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "存在同日 release $tag，删除后重建"
            gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            自动构建，提交 `${{ github.sha }}`，Qt ${{ env.QT_VERSION }}。

            各压缩包包含 ShadcnWidgetToolsExample 与对应平台的 Qt 运行库：Windows 为 zip，Linux 与 macOS 为 tar.gz。
          fail_on_unmatched_files: true
          files: dist/*
